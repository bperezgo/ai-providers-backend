version: '3.8'

services:
  # ---- Existing: PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: ai-backend-postgres
    environment:
      POSTGRES_USER: ai_backend
      POSTGRES_PASSWORD: ai_backend_password
      POSTGRES_DB: ai_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Prometheus (Metrics) ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-backend-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'

  # ---- MinIO (Local S3-compatible storage for Loki) ----
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ai-backend-minio
    environment:
      MINIO_ROOT_USER: loki
      MINIO_ROOT_PASSWORD: supersecret
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the Loki bucket in MinIO on startup
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: ai-backend-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 loki supersecret &&
      mc mb --ignore-existing local/loki-chunks &&
      mc mb --ignore-existing local/loki-ruler &&
      echo 'MinIO buckets ready'
      "
    restart: "no"

  # ---- Loki (Logs) ----
  loki:
    image: grafana/loki:3.1.0
    container_name: ai-backend-loki
    user: "0"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml
      - loki_data:/loki
    ports:
      - "3100:3100"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # Fix permissions before Loki starts
    entrypoint: ["/bin/sh", "-c", "chown -R 10001:10001 /loki && exec /usr/bin/loki -config.file=/etc/loki/config.yml"]

  # ---- Tempo (Traces) ----
  tempo:
    image: grafana/tempo:2.5.0
    container_name: ai-backend-tempo
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/config.yml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"    # Tempo query frontend
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    command: -config.file=/etc/tempo/config.yml

  # ---- Grafana Alloy (Unified Agent) ----
  alloy:
    image: grafana/alloy:v1.2.0
    container_name: ai-backend-alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"  # Alloy UI
      - "4319:4318"    # OTLP HTTP receiver (Go app sends here)
    command: run /etc/alloy/config.alloy
    depends_on:
      - loki
      - tempo

  # ---- Grafana (Visualization) ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-backend-grafana
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor correlations
    depends_on:
      - prometheus
      - loki
      - tempo

  # ---- Alertmanager ----
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ai-backend-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  minio_data:
  tempo_data:
  grafana_data:
